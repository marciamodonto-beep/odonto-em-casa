<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odonto em Casa</title>
<style>
body {
font-family: Arial, sans-serif;
background: #eef2f8;
margin: 0;
color: #243454;
}
header {
background: #243b80;
color: white;
text-align: center;
padding: 25px;
}
main {
max-width: 420px;
margin: 30px auto;
background: white;
padding: 25px;
border-radius: 12px;
box-shadow: 0 4px 20px #0001;
}
input, button {
box-sizing: border-box;
width: 100%;
padding: 12px;
margin: 8px 0;
border-radius: 6px;
}
input {
border: 1px solid #ccc;
}
button {
background: #304db5;
color: white;
border: none;
font-size: 16px;
}
h2, p {
text-align: center;
}
</style>
</head>
<body>

<header>
<h1>ODONTO EM CASA</h1>
<p>Área do profissional</p>
</header>

<main>
<h2>Cadastro de dentistas</h2>

<input id="nome" placeholder="Nome completo" required>
<input id="cro" placeholder="Número do CRO" required>
<input id="estado" placeholder="Estado" required>
<input id="cidade" placeholder="Cidade" required>
<input id="especialidade" placeholder="Especialidade" required>
<input id="email" type="email" placeholder="E-mail" required>
<input id="senha" type="password" placeholder="Senha" required>

<button id="btnCadastro" type="button" onclick="cadastrarDentista()">Criar minha conta</button>

<hr>

<h2>Já possui cadastro?</h2>

<input id="loginEmail" type="email" placeholder="Seu e-mail" required>
<input id="loginSenha" type="password" placeholder="Sua senha" required>

<button type="button" onclick="entrar()">Entrar</button>

<p>Ambiente em configuração.</p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://sbubucjwxgtckdwedose.supabase.co";
const supabaseKey = "sb_publishable_gxSIMwZsEcWE8jkCIN3hqQ_4ATyz7Gu";

const clienteSupabase = window.supabase.createClient(
supabaseUrl,
supabaseKey
);

  async function cadastrarDentista() {
const nome = document.getElementById("nome").value.trim();
const cro = document.getElementById("cro").value.trim();
const estado = document.getElementById("estado").value.trim();
const cidade = document.getElementById("cidade").value.trim();
const especialidade = document.getElementById("especialidade").value.trim();
const email = document.getElementById("email").value.trim();
const senha = document.getElementById("senha").value;

if (!nome || !cro || !estado || !cidade || !especialidade || !email || !senha) {
alert("Preencha todos os campos.");
return;
}

    const { data, error } = await clienteSupabase.auth.signUp({
email: email,
password: senha,
options: {
emailRedirectTo: "https://marciamodonto-beep.github.io/odonto-em-casa/"
}
});

if (error) {
alert("Não foi possível criar a conta.");
return;
}

alert("Verifique seu e-mail para confirmar o cadastro.");
}
async function entrar() {
const email = document.getElementById("loginEmail").value.trim();
const senha = document.getElementById("loginSenha").value;

if (!email || !senha) {
alert("Preencha o e-mail e a senha.");
return;
}

const { data, error } = await clienteSupabase.auth.signInWithPassword({
email: email,
password: senha
});

if (error) {
alert("Não foi possível entrar. Verifique seu e-mail e senha.");
return;
}

alert("Login realizado com sucesso!");
}
 </script>
</body>
</html>
