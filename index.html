<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odonto em Casa</title>
<style>
body {
font-family: Arial, sans-serif;
background: #eef2f8;
margin: 0;
color: #243454;
}
header {
background: #243b80;
color: white;
text-align: center;
padding: 25px;
}
main {
max-width: 420px;
margin: 30px auto;
background: white;
padding: 25px;
border-radius: 12px;
box-shadow: 0 4px 20px #0001;
}
input, button {
box-sizing: border-box;
width: 100%;
padding: 12px;
margin: 8px 0;
border-radius: 6px;
}
input {
border: 1px solid #ccc;
}
button {
background: #304db5;
color: white;
border: none;
font-size: 16px;
}
h2, p {
text-align: center;
}
</style>
</head>
<body>

<header>
<h1>ODONTO EM CASA</h1>
<p>Área do profissional</p>
</header>

<main>
<h2>Cadastro de dentistas</h2>

<input placeholder="Nome completo" disabled>
<input placeholder="Número do CRO" disabled>
<input placeholder="Estado" disabled>
<input placeholder="Cidade" disabled>
<input placeholder="Especialidade" disabled>
<input type="email" placeholder="E-mail" disabled>
<input type="password" placeholder="Senha" disabled>

<button disabled>Criar minha conta</button>

<hr>

<h2>Já possui cadastro?</h2>

<input type="email" placeholder="Seu e-mail" disabled>
<input type="password" placeholder="Sua senha" disabled>

<button disabled>Entrar</button>

<p>Ambiente em configuração.</p>

</main>
</body>
</html>
