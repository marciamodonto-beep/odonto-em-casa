<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Dentista</title>


<link rel="stylesheet" href="estilo.css">
</head>

<body class="painel">

<header>
<h1>ODONTO EM CASA</h1>
<p>Área do profissional</p>
<nav aria-label="Navegação principal"><a href="buscar.html">Buscar dentistas</a></nav>
</header>

<main id="painel" hidden>

<h2>Bem-vindo ao seu painel!</h2>

<p id="usuario"></p>

<button onclick="location.href='perfil.html'">Meu perfil profissional</button>

<button disabled>Minha disponibilidade — em breve</button>

<button disabled>Meus atendimentos — em breve</button>
<button id="botaoAdmin" hidden style="display:none;" onclick="location.href='admin.html'">Painel administrativo</button>
<button onclick="sair()">Sair da conta</button>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://sbubucjwxgtckdwedose.supabase.co";

const supabaseKey = "sb_publishable_gxSIMwZsEcWE8jkCIN3hqQ_4ATyz7Gu";


const clienteSupabase = window.supabase.createClient(
supabaseUrl,
supabaseKey
);

async function verificarLogin() {

const { data, error } = await clienteSupabase.auth.getUser();

if (error || !data.user) {
window.location.replace("index.html");
return;
}

document.getElementById("usuario").textContent =
data.user.email;

document.getElementById("painel").hidden = false;

  const permissaoAdmin = await clienteSupabase.rpc("eh_administrador");

if (!permissaoAdmin.error && permissaoAdmin.data === true) {
const botaoAdmin = document.getElementById("botaoAdmin");
botaoAdmin.hidden = false;
botaoAdmin.style.display = "block";
}

}

async function sair() {
const { error } = await clienteSupabase.auth.signOut();

if (error) {
alert("Não foi possível sair.");
return;
}

window.location.replace("index.html");
}

verificarLogin();

</script>

<footer>Odonto em Casa · Atendimento odontológico domiciliar</footer>
</body>
</html>
